# Local stack:  docker compose up        (app on :3000, Neo4j Browser on :7474)
# Neo4j only:   docker compose up neo4j  (then `npm run dev` with apps/web/.env.local)
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/tpcopilot-dev
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p tpcopilot-dev 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 20
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["3000:3000"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: tpcopilot-dev
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      neo4j: { condition: service_healthy }
volumes:
  neo4j-data:
