apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - neo4j.yaml
  - deployment.yaml
  - service.yaml
# Secrets are NOT committed. Create them once per cluster:
#   kubectl create secret generic neo4j-auth --from-literal=NEO4J_AUTH=neo4j/<password>
#   kubectl create secret generic tp-copilot-secrets \
#     --from-literal=NEO4J_PASSWORD=<password> --from-literal=OPENROUTER_API_KEY=sk-or-...
