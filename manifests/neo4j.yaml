# Neo4j Community as a single-replica StatefulSet with persistent storage.
# Auth comes from a Secret (not committed):
#   kubectl create secret generic neo4j-auth --from-literal=NEO4J_AUTH=neo4j/<password>
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels: { app: neo4j }
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels: { app: neo4j }
  template:
    metadata:
      labels: { app: neo4j }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - { name: http, containerPort: 7474 }
            - { name: bolt, containerPort: 7687 }
          envFrom:
            - secretRef: { name: neo4j-auth }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: 7687 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  selector: { app: neo4j }
  ports:
    - { name: http, port: 7474, targetPort: 7474 }
    - { name: bolt, port: 7687, targetPort: 7687 }
